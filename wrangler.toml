name = "lifeteller"
pages_build_output_dir = "dist"
compatibility_flags = [ "nodejs_compat" ]

[[d1_databases]]
binding = "DB" # This binding name is used in your functions
database_name = "lifeteller_db"
database_id = "" # To be filled by the user after creating the database

[vars]
# Ensure these are also set in the Cloudflare Dashboard under Settings -> Variables
JWT_SECRET = "change-me-in-production"
ADMIN_PASSWORD = "admin"
# GEMINI_API_KEY should be set in the dashboard for security
